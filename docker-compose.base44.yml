# Base44 sandbox environment for the SONIQUE store.
#
# Runs everything from the CLONED SOURCE with live reload (no prebuilt app images):
#   db      - Postgres (infrastructure, plain image + volume)
#   migrate - one-shot schema + catalog seed, exits when done
#   api     - Express REST API (node --watch for reload), also reachable on host port 4000
#   web     - Vite dev server for the React storefront, public entry point on host port 3000
#
# The storefront talks to the API through the Vite dev-server proxy (`/api` -> http://api:4000),
# so the browser only ever sees a single origin. That keeps cookies/sessions same-origin and
# needs no CORS exception.
#
# Placeholders live in ./.env.base44-defaults (committed); the platform-managed secrets file
# /run/base44/app.env is listed LAST so real values always win.
name: sonique

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: sonique
      POSTGRES_PASSWORD: sonique_dev_password
      POSTGRES_DB: sonique
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonique -d sonique"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sonique:sonique_dev_password@db:5432/sonique
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && node src/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: SONIQUE API
      base44.kind: api
      base44.port: "4000"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    env_file:
      # placeholders first, real platform secrets last (last wins)
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://sonique:sonique_dev_password@db:5432/sonique
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    ports:
      - "4000:4000"
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node --watch src/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: SONIQUE Store
      base44.kind: web
      base44.port: "3000"
      base44.docs: /
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      # Vite >= 6.1 appends this to server.allowedHosts (platform sets it)
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
      API_PROXY_TARGET: http://api:4000
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
